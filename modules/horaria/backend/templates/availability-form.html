<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disponibilidad semanal</title><style>body{font:17px system-ui;max-width:680px;margin:40px auto;padding:20px;color:#173329}label{display:block;margin:16px 0 6px}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #9ab3a7;border-radius:7px;width:100%;box-sizing:border-box}button{margin-top:24px;background:#173329;color:white;cursor:pointer}.notice{background:#ecf3ee;padding:16px;border-radius:8px}textarea{height:110px}</style>
<h1>Disponibilidad semanal</h1><p class="notice">Plantilla local. Descarga tu respuesta y entrégala al responsable. La identidad y las peticiones deben revisarse antes de aplicarse. No envía mensajes ni modifica horarios. Un día sin indicar sigue pendiente.</p>
<form id="availability"><label>Semana ISO (ejemplo: 2026-W41)<input name="week" required pattern="[0-9]{4}-W[0-9]{2}"></label><label>ID de tienda, indicado por el responsable<input name="shop" type="number" min="1" step="1" required></label><label>ID de persona, indicado por el responsable<input name="employee" type="number" min="1" step="1" required></label><div id="days"></div><label>Observaciones<textarea name="notes" maxlength="2000"></textarea></label><button>Descargar respuesta para revisar</button></form><p id="result" role="status"></p>
<script>
'use strict';
const days=['LUNES','MARTES','MIERCOLES','JUEVES','VIERNES','SABADO','DOMINGO'];
const labels=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const values=[['SIN_INDICAR','Pendiente de indicar'],['MANANA','Mañana'],['TARDE','Tarde'],['AMBOS','Mañana y tarde'],['NO_DISPONIBLE','No disponible']];
days.forEach((day,index)=>{const label=document.createElement('label');label.textContent=labels[index];const select=document.createElement('select');select.name=day;values.forEach(([value,text])=>{const option=document.createElement('option');option.value=value;option.textContent=text;select.append(option)});label.append(select);document.querySelector('#days').append(label)});
document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();const f=new FormData(event.currentTarget);const shop=Number(f.get('shop')),employeeId=Number(f.get('employee')),semana=String(f.get('week'));if(!Number.isSafeInteger(shop)||!Number.isSafeInteger(employeeId)||shop<1||employeeId<1)return;const payload={establecimientoId:shop,semana,responses:[{employeeId,week:semana,source:'FORMULARIO',days:Object.fromEntries(days.map(d=>[d,String(f.get(d))])),notes:String(f.get('notes'))}]};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`disponibilidad-${semana}-${employeeId}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#result').textContent='Respuesta descargada. Entrega el archivo al responsable para que revise persona, tienda, semana y peticiones antes de incorporarlas al Excel.'});
</script></html>
