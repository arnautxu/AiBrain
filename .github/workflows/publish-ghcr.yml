name: Publish GHCR images

on:
  workflow_run:
    workflows: [Backend CI]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: publish-ghcr-main
  cancel-in-progress: true

jobs:
  publish:
    name: Publish the exact tested image manifest without rebuilding
    if: >-
      github.repository == 'arnautxu/AiBrain' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the successful source and validation workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]{6,20}$ ]]
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/backend-ci.yml" --jq '.id')"
          jq -e --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY" \
            --argjson id "$CI_RUN_ID" --argjson workflow "$workflow_id" \
            '.id == $id and .workflow_id == $workflow and .path == ".github/workflows/backend-ci.yml"
             and .head_sha == $sha and .head_branch == "main" and .event == "push"
             and .status == "completed" and .conclusion == "success"
             and .repository.full_name == $repo and .head_repository.full_name == $repo' \
            <<<"$run" > /dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$RELEASE_SHA"
      - name: Download the digests staged by the actual image acceptance job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aibrain-tested-images-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/tested-images
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Require the same source and both Arnau image repositories
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLICATION_RUN_ID: ${{ github.run_id }}
        run: |
          release="$RUNNER_TEMP/tested-images/release.json"
          test -f "$release" && test ! -L "$release"
          test "$(wc -c < "$release")" -le 4096
          jq -e --arg sha "$RELEASE_SHA" \
            '.schemaVersion == 1 and .revision == $sha
             and (.image | test("^ghcr\\.io/arnautxu/aibrain@sha256:[0-9a-f]{64}$"))
             and (.egressImage | test("^ghcr\\.io/arnautxu/aibrain-egress@sha256:[0-9a-f]{64}$"))' \
            "$release" > /dev/null
          cp "$release" release.json
          jq -n --arg revision "$RELEASE_SHA" --arg ci "$CI_RUN_ID" \
            --arg publication "$PUBLICATION_RUN_ID" \
            '{revision:$revision,validationRunId:$ci,publicationRunId:$publication,rebuild:false}' \
            > publication.json
      - name: Publish the unchanged digest manifest for the restricted deploy workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aibrain-ghcr-release-${{ github.event.workflow_run.head_sha }}
          path: |
            release.json
            publication.json
          if-no-files-found: error
          retention-days: 7
