name: Deploy Arnall

on:
  workflow_run:
    workflows:
      - Publish GHCR images
    branches:
      - main
    types:
      - completed

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: deploy-arnall-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Promote tested main to arnall.graphikai.com
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download the immutable GHCR release identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aibrain-ghcr-release-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/aibrain-ghcr-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate the immutable GHCR release identity
        id: release
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          release_file="$RUNNER_TEMP/aibrain-ghcr-release/release.json"
          test -f "$release_file"
          revision="$(jq -er '.revision' "$release_file")"
          app_image="$(jq -er '.image' "$release_file")"
          egress_image="$(jq -er '.egressImage' "$release_file")"
          [[ "$revision" == "$TESTED_SHA" && "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$app_image" =~ ^ghcr\.io/arnautxu/aibrain@sha256:[0-9a-f]{64}$ ]]
          [[ "$egress_image" =~ ^ghcr\.io/arnautxu/aibrain-egress@sha256:[0-9a-f]{64}$ ]]
          printf 'revision=%s\napp_image=%s\negress_image=%s\n' "$revision" "$app_image" "$egress_image" >> "$GITHUB_OUTPUT"

      - name: Refuse a superseded main revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_sha" == "$TESTED_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer main revision exists; this tested revision is intentionally skipped."
          fi

      - name: Prepare the restricted deployment identity
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.ARNALL_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ARNALL_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/arnall-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/arnall-ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/arnall-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/arnall-ssh/id_ed25519" "$RUNNER_TEMP/arnall-ssh/known_hosts"

      - name: Pull and promote the tested GHCR digests through the restricted gateway
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ vars.ARNALL_DEPLOY_HOST }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          APP_IMAGE: ${{ steps.release.outputs.app_image }}
          EGRESS_IMAGE: ${{ steps.release.outputs.egress_image }}
          GHCR_PULL_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          test -n "$DEPLOY_HOST"
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP_IMAGE" =~ ^ghcr\.io/arnautxu/aibrain@sha256:[0-9a-f]{64}$ ]]
          [[ "$EGRESS_IMAGE" =~ ^ghcr\.io/arnautxu/aibrain-egress@sha256:[0-9a-f]{64}$ ]]
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
          test -n "$GHCR_PULL_TOKEN"
          printf '%s' "$GHCR_PULL_TOKEN" | ssh \
            -i "$RUNNER_TEMP/arnall-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/arnall-ssh/known_hosts" \
            root@"$DEPLOY_HOST" "deploy-ghcr $TESTED_SHA $APP_IMAGE $EGRESS_IMAGE $GHCR_USERNAME"

      - name: Bootstrap the durable Arnall workspace owner when requested
        if: steps.current.outputs.deploy == 'true' && vars.ARNALL_BOOTSTRAP_ADMIN_USER_ID != ''
        env:
          DEPLOY_HOST: ${{ vars.ARNALL_DEPLOY_HOST }}
          BOOTSTRAP_ADMIN_USER_ID: ${{ vars.ARNALL_BOOTSTRAP_ADMIN_USER_ID }}
        run: |
          [[ "$BOOTSTRAP_ADMIN_USER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          ssh \
            -i "$RUNNER_TEMP/arnall-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/arnall-ssh/known_hosts" \
            root@"$DEPLOY_HOST" "bootstrap-admin $BOOTSTRAP_ADMIN_USER_ID"

      - name: Collect post-deploy release identity readbacks
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ vars.ARNALL_DEPLOY_HOST }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          test -n "$DEPLOY_HOST"
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]{6,20}$ ]]
          ssh \
            -i "$RUNNER_TEMP/arnall-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/arnall-ssh/known_hosts" \
            root@"$DEPLOY_HOST" "collect-readbacks $TESTED_SHA $CI_RUN_ID" > /dev/null
