name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - Arnau
      - codex/aibrain-backend-definitivo

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

jobs:
  quality:
    name: Types, lint, contracts, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use pinned Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Verify generated Codex contracts
        run: npm run contracts:verify
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit, integration and contract tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate infrastructure contracts
        run: |
          npm run infra:validate
          bash -n infra/hetzner/app/deploy-arnall-main.sh
          bash -n infra/hetzner/app/deploy-arnau-preview.sh
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Audit complete dependency tree
        run: npm audit --audit-level=critical

  e2e:
    name: Filesystem and restart E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use pinned Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run HTTP E2E
        run: npm run test:e2e

  documents:
    name: Real Office, PDF, text and image matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use pinned Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Install native document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-calc libreoffice-impress libreoffice-writer \
            poppler-utils python3-pip qpdf
          python3 -m pip install --break-system-packages --no-cache-dir \
            python-pptx==1.0.2
      - name: Install locked dependencies
        run: npm ci
      - name: Run real document matrix
        run: npm run test:documents:real

  containers:
    name: Clean immutable container builds
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate Compose model without secrets
        env:
          AIBRAIN_RUNTIME_ENV_FILE: ci.env.placeholder
          AIBRAIN_EGRESS_ENV_FILE: ci.env.placeholder
          AIBRAIN_ALERTS_ENV_FILE: ci.env.placeholder
          AIBRAIN_REPLICA_ENV_FILE: ci.env.placeholder
        run: |
          docker compose \
            --env-file infra/hetzner/compose.env.example \
            -f infra/hetzner/compose.yaml \
            config --no-env-resolution --quiet
      - name: Build application image from scratch
        run: |
          docker build --pull --no-cache \
            --target runtime \
            --build-arg AIBRAIN_REVISION="${GITHUB_SHA}" \
            --tag "aibrain-ci:${GITHUB_SHA}" .
      - name: Build egress gateway image from scratch
        run: |
          docker build --pull --no-cache \
            --target egress-gateway \
            --build-arg AIBRAIN_REVISION="${GITHUB_SHA}" \
            --tag "aibrain-egress-ci:${GITHUB_SHA}" .

  deploy-arnau-preview:
    name: Deploy tested Arnau revision to the isolated preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/Arnau'
    needs:
      - quality
      - e2e
      - documents
      - containers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the tested immutable revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse a superseded Arnau revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/Arnau" --jq '.object.sha')"
          if [[ "$current_sha" == "$TESTED_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer Arnau revision exists; this tested revision is intentionally skipped."
          fi

      - name: Prepare the restricted deployment identity
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.ARNAU_PREVIEW_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ARNAU_PREVIEW_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/arnau-preview-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/arnau-preview-ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/arnau-preview-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/arnau-preview-ssh/id_ed25519" "$RUNNER_TEMP/arnau-preview-ssh/known_hosts"

      - name: Deploy the tested source through the restricted preview gateway
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ vars.ARNAU_PREVIEW_DEPLOY_HOST }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          git archive --format=tar "$TESTED_SHA" | ssh \
            -i "$RUNNER_TEMP/arnau-preview-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/arnau-preview-ssh/known_hosts" \
            root@"$DEPLOY_HOST" "deploy $TESTED_SHA"
